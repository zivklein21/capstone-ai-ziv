[project]
name = "capstone-ai-ziv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zivklein21", email = "zivklein21@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.scripts]
capstone-ai-ziv = "capstone_ai_ziv:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[tool.pytest.init_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
